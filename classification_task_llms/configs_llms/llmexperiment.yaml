apiVersion: batch/v1
kind: Job
metadata:
  name: llmprompting
  labels:
    app: llmprompting
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: llmprompting
    spec:
      containers:
        - name: llmprompting
          image: registry.datexis.com/troehr/medical_note_classification
          imagePullPolicy: Always
          command: [
            "python", "-m", "src.llm_experiments.evaluate_prompting",
                "--splits-dir", "/pvc/llm_splits",
                "--split", "test",
                "--setting", "zero_shot",
                "--output-dir", "/pvc/llm_results/llama31_8b_zero_shot",
                "--backend", "local",
                "--model-name", "meta-llama/Meta-Llama-3.1-8B-Instruct",
                "--batch-size", "1",
                "--max-new-tokens", "64",
                "--temperature", "0.0",
                "--device-map", "auto",
                "--torch-dtype", "auto",
          ]
          env: 
            - name: LANG
              value: 'C.UTF-8'
            - name: TOKENIZERS_PARALLELISM
              value: 'false'
            - name: NCCL_DEBUG
              value: 'INFO'
            - name: TRANSFORMERS_CACHE
              value: "/pvc/huggingface_cache"
            - name: HF_HOME
              value: "/pvc/huggingface_cache"
            - name: HF_DATASETS_CACHE
              value: "/pvc/huggingface_datasets_cache"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
          resources:
            requests:
              cpu: "4"
            limits:
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: llm-data-pvc
              mountPath: /pvc
            - name: dshm
              mountPath: /dev/shm
      nodeSelector:
        kubernetes.io/hostname: cl-worker27
        gpu: a100
      volumes:
        - name: llm-data-pvc
          persistentVolumeClaim:
            claimName: llm-data-pvc
        - name: dshm
          emptyDir:
            medium: Memory
      imagePullSecrets:
        - name: private-registry-auth
      restartPolicy: Never
      
      