{
    "port": 8000,
    "server_name": "potato annotator",
    "annotation_task_name": "Intent Verification",
    "output_annotation_dir": "annotation_output",
    "output_annotation_format": "tsv",
    "annotation_codebook_url": "https://docs.google.com/document/d/1z_HmlQwK6MJzC95_5XogR2oW7PdxT9H5/edit?usp=sharing&ouid=106920944101437497932&rtpof=true&sd=true",
    "data_files": [
        "data_files/Plan_potato.csv",
        "data_files/prestudy/prestudy_data.csv"
    ],
    "item_properties": {
        "id_key": "id",
        "text_key": "text"
    },
    "list_as_text": {
        "text_list_prefix_type": "None",
        "horizontal": false
    },
    "user_config": {
        "allow_all_users": true,
        "users": []
    },
    "login": {
        "type": "none",
        #"url_argument": "PROLIFIC_PID"
    },
    "jumping_to_id_disabled": true,
    "hide_navbar": false,
  # define the surveyflow of the system, set up the pages before and after the data annotation page
    "surveyflow": {
      "on": True,
      #"order" : ['pre_annotation', 'prestudy_passed', 'prestudy_failed', 'post_annotation'],
      "order" : ["pre_annotation", "prestudy_passed", "prestudy_failed", "post_annotation"],
      "pre_annotation": ["surveyflow/introduction.jsonl", "surveyflow/instruction.jsonl","surveyflow/consent.jsonl", "surveyflow/prestudy_intro.jsonl"],
      "prestudy_passed": ["surveyflow/prestudy_pass.jsonl"],
      "prestudy_failed": ["surveyflow/prestudy_fail.jsonl"],
      "post_annotation": ["surveyflow/experience.jsonl","surveyflow/end.jsonl"],
      # If set, we will automatically generate testing questions similar to the annotation instances, but explicitly ask the annotator to choose one option    , 'surveyflow/consent.jsonl'
    },

    "prestudy": {
        "on": true,
        "minimum_score": 0.6,
        "groundtruth_key": 'whether_match',
        "question_key":'The annotated intent of the sentence is correct',
        "answer_mapping": {'Yes': True, 'No': False},
        "pass_page": "surveyflow/prestudy_pass.jsonl",
        "fail_page": "surveyflow/prestudy_fail.jsonl"
    },
    "automatic_assignment": {
        "on": true,
        "output_filename": "task_assignment.json",
        "sampling_strategy": "random",
        "labels_per_instance": 1,
        "instance_per_annotator": 100,
        "test_question_per_annotator": 0,
        "users": []
    },
    "alert_time_each_instance": 10000000,
    "horizontal_key_bindings": true,
    "annotation_schemes": [
        {
            "annotation_type": "radio",
            "name": "The annotated intent of the sentence is correct",
            "description": "The annotated intent of the sentence is correct",
            "labels": [
               "Yes", "No",
            ],
            "has_free_response":  {
                "instruction": "If you disagree, please address the number and correct intent:",
                "tooltip": "Please provide your comments here",
                "label_requirement": {"required": true},
           
                
            },
            #"displaying_score": true,
            "label_requirement": {
                "required": true
            },
            "sequential_key_binding": True, 
        }
    ],
    "html_layout": "templates/layout.html",
    "base_html_template": "default",
    "header_file": "default",
    "site_dir": "default"
}